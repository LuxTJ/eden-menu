<link rel="stylesheet" href="styles.css?v=22">

<header class="hero">
<div class="hero-bg"></div>
<div class="hero-overlay"></div>
<div class="hero-content">
<div class="logo-circle">
<img src="logo.png" alt="Club Eden">
</div>
<h1>Club Eden</h1>
<p class="subtitle">Late Night Menu</p>
<p class="location-badge" id="location-badge"></p>
</div>
</header>

<nav class="bottom-nav">
<a href="#contact" class="nav-item">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
<span>CONTACT</span>
</a>
<button class="cart-btn" onclick="showCart()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
<span class="cart-count" id="cart-count">0</span>
</button>
</nav>

<div class="cart-modal" id="cart-modal">
<div class="cart-content">
<div class="cart-header">
<h2>Your Order</h2>
<button class="close-cart" onclick="closeCart()">×</button>
</div>
<div class="cart-items" id="cart-items"></div>
<div class="cart-total" id="cart-total">Total: $0</div>
<div class="customer-form" id="customer-form">
<h3>Order Details</h3>
<label>Which Location Are You At?</label>
<div class="location-toggle">
<button class="location-toggle-btn" data-loc="dfw" onclick="setPreviewLocation('dfw')">DFW</button>
<button class="location-toggle-btn" data-loc="satx" onclick="setPreviewLocation('satx')">San Antonio</button>
</div>
<div id="side-selector-wrapper" style="display: none; margin-top: 1rem;">
<label>Which Side Are You At?</label>
<div class="side-toggle">
<button class="side-toggle-btn active" data-side="eden" onclick="setSide('eden')">Eden</button>
<button class="side-toggle-btn" data-side="infliction" onclick="setSide('infliction')">Infliction Hall</button>
</div>
</div>
<div id="location-selector-area"></div>
<label>Name</label>
<input type="text" id="customer-name" placeholder="Your name">
<label>Email</label>
<input type="email" id="customer-email" placeholder="your@email.com">
</div>
<button class="checkout-btn" onclick="placeOrder()">Place Order</button>
</div>
</div>

<div class="order-confirmation" id="order-confirmation">
<div class="confirmation-content">
<div class="checkmark">✓</div>
<h2>Order Placed!</h2>
<p id="confirmation-text"></p>
<button class="checkout-btn" onclick="closeConfirmation()">Done</button>
</div>
</div>

<main id="menu" class="menu-container">
<section class="menu-section" id="starters">
<h2 class="section-title">STARTERS</h2>
<div class="menu-list" id="starters-list"></div>
</section>

<section class="menu-section" id="mains">
<h2 class="section-title">MAINS</h2>
<div class="menu-list" id="mains-list"></div>
</section>

<section class="menu-section" id="sweets">
<h2 class="section-title">SWEET THINGS</h2>
<div class="menu-list" id="sweets-list"></div>
</section>

<div class="menu-list" id="drinks-list"></div>
</main>
